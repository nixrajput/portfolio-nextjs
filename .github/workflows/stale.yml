name: Stale

# Marks inactive issues/PRs stale, then closes them after a grace period.
on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 210
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,blocked
          exempt-pr-labels: pinned,security,blocked
          stale-issue-message: >
            This issue has been inactive for 210 days and is now marked stale.
            Comment to keep it open; it will close in 30 days otherwise.
          stale-pr-message: >
            This PR has been inactive for 210 days and is now marked stale.
            Push or comment to keep it open; it will close in 30 days otherwise.
