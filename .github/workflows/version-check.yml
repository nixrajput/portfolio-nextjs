name: Version Check

# Enforces that every PR into master bumps the package.json version. The Release
# workflow turns that version into a tag + GitHub Release on merge, so a PR that
# forgets to bump would either fail to release or collide with an existing tag.
# This is a required check: a PR cannot merge until the version moves forward.
on:
  pull_request:
    branches: [master]
    # Re-run when the PR opens, gets new commits, or its base changes.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  version-bumped:
    name: package.json version bumped
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read PR version
        id: pr
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Read base (master) version
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The PR checkout has no base branch ref, so fetch it. Without the fetch the
          # base version read as empty and every PR passed.
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base_version=$(git show FETCH_HEAD:package.json | jq -r .version)
          test -n "$base_version"
          echo "version=$base_version" >> "$GITHUB_OUTPUT"

      # Not paths-ignore on the trigger: this is a required check, so a skipped run would
      # leave the PR pending forever. HEAD is the PR merge commit, so a tree diff against
      # the fetched base lists the PR's files without needing history.
      - name: Does this PR change anything that ships
        id: scope
        run: |
          changed=$(git diff --no-renames --name-only FETCH_HEAD HEAD)
          echo "changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          infra=$(printf '%s\n' "$changed" | grep -cE '^(\.github/|\.claude/|\.nvmrc$|AGENTS\.md$|CLAUDE\.md$)' || true)
          echo "total=${total:-0} infra-only=${infra:-0}"
          if [ "${total:-0}" -gt "${infra:-0}" ]; then
            echo "ships=true" >> "$GITHUB_OUTPUT"
          else
            echo "ships=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        env:
          PR_VERSION: ${{ steps.pr.outputs.version }}
          BASE_VERSION: ${{ steps.base.outputs.version }}
          SHIPS: ${{ steps.scope.outputs.ships }}
        run: |
          if [ "$SHIPS" != "true" ]; then
            echo "Only .github/, .claude/, the runtime pin or the agent guides changed; version bump not required."
            exit 0
          fi
          echo "Base (master): $BASE_VERSION"
          echo "PR:            $PR_VERSION"

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::package.json version was not bumped. Update \"version\" in package.json (it is still $BASE_VERSION). Use a SemVer bump: patch for fixes, minor for features, major for breaking changes."
            exit 1
          fi

          # Confirm the PR version is strictly GREATER than base, not just different
          # (guards against an accidental downgrade). `sort -V` orders SemVer; the
          # greater of the two must be the PR version, and they must differ.
          greater=$(printf '%s\n%s\n' "$BASE_VERSION" "$PR_VERSION" | sort -V | tail -n1)
          if [ "$greater" != "$PR_VERSION" ]; then
            echo "::error::package.json version $PR_VERSION is lower than master's $BASE_VERSION. The version must move forward."
            exit 1
          fi

          echo "Version bumped $BASE_VERSION -> $PR_VERSION ✓"
