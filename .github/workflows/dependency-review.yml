name: Dependency Review

# Fails a PR that introduces a dependency with a known vulnerability or a
# disallowed licence. With CodeQL and Dependabot update PRs deliberately absent
# fleet-wide, this is the supply-chain gate.
on:
  pull_request:
    branches: [master, v2]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
